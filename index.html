<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Calendario" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest" />
  <script>
    (function () {
      try {
        var isStandalone =
          window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: window-controls-overlay)').matches ||
          window.matchMedia('(display-mode: minimal-ui)').matches ||
          window.matchMedia('(display-mode: fullscreen)').matches ||
          window.navigator.standalone === true ||
          window.location.search.indexOf('source=pwa') !== -1 ||
          window.location.search.indexOf('mode=standalone') !== -1;
        if (isStandalone) {
          document.documentElement.classList.add('is-pwa-standalone');
          localStorage.setItem('cal_pwa_installed', 'true');
        }
      } catch (e) {}

      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function () {
        try {
          localStorage.setItem('cal_pwa_installed', 'true');
        } catch (e) {}
        window.__deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed-change', { detail: { isInstalled: true } }));
      });
    })();
  </script>
  <title>Calendario Escolar</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
